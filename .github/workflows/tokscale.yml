name: tokscale update

# Once a week, see whether tokscale has a new release. If it does, bundle it
# the verified way, run the whole test suite against it (including the
# contract tests that read real session log formats), and open an issue with
# the result. Moving the pin stays a human decision.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compare with npm
        id: versions
        run: |
          pinned=$(grep '^version=' Vendor/tokscale/tokscale.lock | cut -d= -f2)
          latest=$(curl -fsSL https://registry.npmjs.org/@tokscale/cli-darwin-arm64/latest | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" != "$latest" ]; then echo "newer=true" >> "$GITHUB_OUTPUT"; fi

      - name: Skip if an issue is already open
        if: steps.versions.outputs.newer == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh issue list --state open --search "tokscale ${{ steps.versions.outputs.latest }} in:title" --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        if: steps.versions.outputs.newer == 'true' && steps.existing.outputs.count == '0'
        run: brew install xcodegen

      - name: Test against the new tokscale
        if: steps.versions.outputs.newer == 'true' && steps.existing.outputs.count == '0'
        id: test
        continue-on-error: true
        run: |
          ./Scripts/fetch-tokscale.sh "${{ steps.versions.outputs.latest }}"
          make test

      - name: Open an issue
        if: steps.versions.outputs.newer == 'true' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            result="The full test suite, including the tokscale contract tests, passed with it."
          else
            result="The test suite failed with it. Check the run before moving the pin."
          fi
          gh issue create \
            --title "tokscale ${{ steps.versions.outputs.latest }} is available" \
            --body "TokNotch bundles tokscale ${{ steps.versions.outputs.pinned }}. ${result}

          Release notes: https://github.com/junhoyeo/tokscale/releases/tag/v${{ steps.versions.outputs.latest }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          To move the pin: \`make tokscale VERSION=${{ steps.versions.outputs.latest }}\`, then \`make test\`, commit \`Vendor/tokscale/tokscale.lock\` and release."
