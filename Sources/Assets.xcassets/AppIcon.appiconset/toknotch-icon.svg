<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18191E"/>
      <stop offset="50%" stop-color="#0E0F12"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="rimB" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <filter id="shadowB" x="0" y="30" width="1024" height="964">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <!-- Gradients for Rings -->
    <linearGradient id="gClaude" x1="280" y1="360" x2="740" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="gCursor" x1="320" y1="380" x2="700" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70E3B5"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="gGemini" x1="380" y1="420" x2="640" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <g filter="url(#shadowB)">
    <rect x="96" y="96" width="832" height="832" rx="192" fill="url(#bgB)"/>
    <rect x="97" y="97" width="830" height="830" rx="191" stroke="url(#rimB)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Top Sleek Notch Tab -->
  <path d="M 360 96 
           C 390 96, 404 116, 412 138 
           L 418 162 
           C 426 194, 446 210, 480 210 
           L 544 210 
           C 578 210, 598 194, 606 162 
           L 612 138 
           C 620 116, 634 96, 664 96 
           Z" 
        fill="#000000"/>
  <path d="M 360 96 
           C 390 96, 404 116, 412 138 
           L 418 162 
           C 426 194, 446 210, 480 210 
           L 544 210 
           C 578 210, 598 194, 606 162 
           L 612 138 
           C 620 116, 634 96, 664 96" 
        stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>

  <!-- Center Triple Concentric Rings (Apple Watch Activity style) -->
  <g transform="translate(512, 560)">
    <!-- Ring 1 (Outer - Claude): r = 240, stroke = 22 -->
    <circle cx="0" cy="0" r="240" stroke="rgba(255,255,255,0.06)" stroke-width="24" fill="none"/>
    <path d="M 0 -240 A 240 240 0 1 1 -170 170" stroke="url(#gClaude)" stroke-width="24" stroke-linecap="round" fill="none"/>

    <!-- Ring 2 (Middle - Cursor): r = 180, stroke = 22 -->
    <circle cx="0" cy="0" r="180" stroke="rgba(255,255,255,0.06)" stroke-width="24" fill="none"/>
    <path d="M 0 -180 A 180 180 0 1 1 170 60" stroke="url(#gCursor)" stroke-width="24" stroke-linecap="round" fill="none"/>

    <!-- Ring 3 (Inner - Gemini): r = 120, stroke = 22 -->
    <circle cx="0" cy="0" r="120" stroke="rgba(255,255,255,0.06)" stroke-width="24" fill="none"/>
    <path d="M 0 -120 A 120 120 0 1 1 -110 -50" stroke="url(#gGemini)" stroke-width="24" stroke-linecap="round" fill="none"/>

    <!-- Central Center Node -->
    <circle cx="0" cy="0" r="44" fill="#000000" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
  </g>
</svg>
