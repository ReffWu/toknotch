name: TokNotch
options:
  bundleIdPrefix: com.reff
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  TokNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # tokscale ships inside the app, so installing TokNotch is the only thing
      # a user has to do — no Homebrew, no npm, no node. A folder reference
      # rather than individual files: Xcode copies the tree with `ditto`, which
      # is what preserves the executable bit.
      - path: Vendor/tokscale
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: TokNotch
        CFBundleDisplayName: TokNotch
        LSMinimumSystemVersion: "14.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reff.toknotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TokNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TokNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reff.toknotch.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  TokNotch:
    build:
      targets:
        TokNotch: all
        TokNotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TokNotchTests
