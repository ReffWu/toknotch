name: TokNotch
options:
  bundleIdPrefix: com.reffwu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  TokNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # tokscale ships inside the app, so installing TokNotch is the only thing
      # a user has to do — no Homebrew, no npm, no node. A folder reference
      # rather than individual files: Xcode copies the tree with `ditto`, which
      # is what preserves the executable bit.
      - path: Sources/Resources
        buildPhase: resources
      - path: Vendor/tokscale
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: TokNotch
        CFBundleDisplayName: TokNotch
        LSMinimumSystemVersion: "14.0"
        # No Dock tile. The notch and the menu bar icon are how it is reached.
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle. These have to live here rather than in Sources/Info.plist:
        # XcodeGen *generates* that file from this block, so anything written
        # into it by hand is silently discarded on the next `make gen`.
        #
        # SUPublicEDKey is the public half of the key pair made by
        # `make sparkle-keys`; the private half stays in the login keychain.
        # Without both of these the app deliberately never starts the updater.
        # Served as an asset on the newest GitHub release, so publishing a
        # release publishes the feed — there is no server to keep alive and
        # nothing to point a domain at. `releases/latest/download/` always
        # redirects to the newest release, and appcast.xml and the dmg are
        # assets of the *same* release, so the feed can never advertise a build
        # that is not sitting beside it.
        SUFeedURL: https://github.com/ReffWu/toknotch/releases/latest/download/appcast.xml
        SUPublicEDKey: wpcSIsJIvvZPj3jAoJuw8wl0+fVXS3K3ChODZ0W8EBI=
        # Answers Sparkle's first-run question for the user. Without it the
        # very first launch opens a dialogue asking permission to check for
        # updates — a poor thing to greet somebody with before they have seen
        # the app do anything.
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reffwu.toknotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TokNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TokNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reffwu.toknotch.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  TokNotch:
    build:
      targets:
        TokNotch: all
        TokNotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TokNotchTests
